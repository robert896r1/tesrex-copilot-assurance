name: Bug report
description: Report a reproducible starter-kit bug
title: "Bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not attach real tenant evidence, secrets, exports, or personal data."
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic/demo data where possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
